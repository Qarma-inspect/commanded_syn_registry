name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - elixir: "1.15"
            otp: "26"
          - elixir: "1.16"
            otp: "26"
          - elixir: "1.17"
            otp: "27"
          - elixir: "1.18"
            otp: "28"
          - elixir: "1.19"
            otp: "28"
            dialyzer: true
            package: true
          - elixir: "1.20"
            otp: "29"
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        id: beam
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: mix-${{ runner.os }}-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-${{ hashFiles('mix.lock') }}
          restore-keys: mix-${{ runner.os }}-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-

      - run: mix deps.get
      - run: mix compile --warnings-as-errors
      - run: mix format --check-formatted
      - run: mix credo --strict
      # The tests start epmd and a distributed node, both of which ship with
      # the Erlang installation that setup-beam puts on the PATH.
      - run: mix test

      - name: Restore the Dialyzer PLT
        if: matrix.dialyzer
        uses: actions/cache@v4
        with:
          path: _build/dev/*.plt*
          key: plt-${{ runner.os }}-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-${{ hashFiles('mix.lock') }}
          restore-keys: plt-${{ runner.os }}-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-

      - name: Run Dialyzer
        if: matrix.dialyzer
        env:
          MIX_ENV: dev
        run: mix dialyzer

      # ex_doc is a dev-only dependency, so these two run in the dev
      # environment. mix hex.build checks the package metadata and file list.
      - name: Build the docs
        if: matrix.package
        env:
          MIX_ENV: dev
        run: mix docs

      - name: Build the Hex package
        if: matrix.package
        env:
          MIX_ENV: dev
        run: mix hex.build
